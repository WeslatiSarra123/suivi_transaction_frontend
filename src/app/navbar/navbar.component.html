<mat-toolbar class="custom-toolbar">
  <mat-menu #menuMobile="matMenu">
    <button mat-menu-item *ngFor="let link of getUserMenu()" [routerLink]="link.link">{{ link.label }}</button>
  </mat-menu>

  <button mat-icon-button [matMenuTriggerFor]="menuMobile" *ngIf="isMobile">
    <mat-icon>menu</mat-icon>
  </button>
  <span routerLink="" class="navbar-brand">Suivi Transaction</span>
  <span class="spacer"></span>
  <!-- Générer les boutons dynamiquement selon le rôle -->
  <ng-container *ngIf="!isMobile">

    <ng-container *ngFor="let item of getUserMenu()">
      <button mat-button *ngIf="item.link"   class="button-navbar" routerLinkActive="active-link"
              [routerLinkActiveOptions]="{ exact: true }"
              [routerLink]="item.link">{{ item.label }}
      </button>
      <button mat-button *ngIf="!item.link" class="button-navbar" (click)="item.action?.()">{{ item.label }}</button>
    </ng-container>
  </ng-container>

  <div class="example-button-row" >
    <div class="example-flex-container">
      <button mat-icon-button [matMenuTriggerFor]="menu"
              aria-label="Example icon button with a vertical three dot icon">
        <mat-icon>more_vert</mat-icon>
      </button>
    </div>

    <mat-menu #menu="matMenu">

      <button mat-menu-item routerLink="/profile" *ngIf="isAdminLoggedIn || isAgentLoggedIn || isUserLoggedIn">
        <mat-icon>account_circle</mat-icon>
        Profile
      </button>
      <button mat-menu-item (click)="this.toggleTheme()">
        <mat-icon>nightlight_round</mat-icon>
        Dark Theme
      </button>
      <button mat-menu-item (click)="logout()" *ngIf="isAdminLoggedIn || isAgentLoggedIn || isUserLoggedIn">
        <mat-icon>logout</mat-icon>

        Logout
      </button>
    </mat-menu>

  </div>
</mat-toolbar>
