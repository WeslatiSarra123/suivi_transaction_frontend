<div class="container">
  <h3><strong>Agent List</strong></h3>
  <table class="table table-bordered table-hover table-responsive agent-table">
    <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Phone Number</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let agent of agents; let index=index " [ngClass]="{'table-row-hover': true, 'even': index % 2 === 0}">
      <td><span>{{ agent.name }}</span></td>
      <td><span>{{ agent.email }}</span></td>
      <td><span>{{ agent.phoneNumber }}</span></td>
      <td>
        <a class="btn btn-sm btn-warning" [href]="'tel:+216' + agent.phoneNumber">
          <i class="fa fa-phone"></i>
        </a>
        <a class="btn btn-sm btn-info" [href]="'mailto:' + agent?.email" title="Send Email">
          <i class="fa fa-envelope-open"></i>
        </a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
