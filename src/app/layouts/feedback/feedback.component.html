<div class="comments-container">
  <ng-container *ngIf="comments?.length > 0; else noComments">
    <mat-card *ngFor="let comment of comments;let i=index" class="comment-card">
      <mat-card-header>
        <div mat-card-avatar class="avatar">
          <img [src]="environment.apiImg+comment?.user?.photo" width="20" height="20" alt="">
        </div>
        <mat-card-title>{{ comment.subject }}</mat-card-title>
        <mat-card-subtitle>
          Posted by {{ comment.user?.name || 'Anonymous' }} on
          {{ comment.createdAt | date: 'medium' }}
        </mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ comment.content }}</p>
      </mat-card-content>
    </mat-card>
  </ng-container>

  <ng-template #noComments>
    <div class="empty-state">
      <mat-icon>sentiment_dissatisfied</mat-icon>
      <p>No comments to display.</p>
    </div>
  </ng-template>
</div>
