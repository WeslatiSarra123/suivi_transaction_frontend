<div class="container-transaction mt-5">
  <h2 class="text-center mb-4">Transaction Results</h2>

  <table class="table table-bordered table-hover table-responsive agent-table"
         *ngIf="transactions && transactions.length > 0; else noResults">
    <thead>
    <tr>
      <th>Order Number</th>
      <th>Type</th>
      <th>Amount</th>
      <th>Currency</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let transaction of transactions;let index=index"
        [ngClass]="{'table-row-hover': true, 'even': index % 2 === 0}">
      <td>{{ transaction.orderNumber }}</td>
      <td>{{ transaction.type }}</td>
      <td>{{ transaction.amount }}</td>
      <td>{{ transaction.currency }}</td>
      <td>{{ transaction.status }}</td>
      <td>
        <button class="btn btn-success" (click)="payNow(transaction.amount, transaction.type, transaction.orderNumber)"
                [disabled]="transaction.status==='approved'">
          Pay Now
        </button>

      </td>
    </tr>
    </tbody>
  </table>

  <ng-template #noResults>
    <p class="text-center ">No transactions found. Please refine your search.</p>
  </ng-template>
  <div *ngIf="errorMessage">
    <p class=" text-center mt-3">{{ errorMessage }}</p>
  </div>
</div>
